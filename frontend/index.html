<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-apply — applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app">
    <nav class="topnav">
      <div class="topnav-inner">
        <div class="brand"><span class="brand-mark">A</span><span>ai-apply</span></div>
        <div class="nav-links">
          <a class="nav-link" data-nav="run" href="/run.html">Run</a>
          <a class="nav-link" data-nav="applications" href="/index.html">Applications</a>
        </div>
        <div class="nav-spacer"></div>
        <div class="user-panel" id="shell-user"></div>
      </div>
    </nav>

    <main class="page">
      <div class="page-header">
        <div>
          <div class="h1">Applications</div>
          <div class="sub">Review one at a time. Edit the cover letter inline before you send.</div>
        </div>
      </div>

      <div id="empty-state" class="card card-pad" style="text-align: center; padding: 60px;" hidden>
        <div class="muted">All caught up. Trigger a new <a href="/run.html" style="color: var(--accent-text);">run</a> to fetch fresh listings.</div>
      </div>

      <div id="error-state" class="error-banner" hidden>
        <div>
          <div style="font-weight:600;margin-bottom:2px;">Couldn't load applications.</div>
          <div id="error-detail" style="opacity:.85"></div>
        </div>
      </div>

      <div id="review-area" hidden>
        <div class="app-toolbar">
          <div class="pager">
            <button class="pager-btn" id="prev"></button>
            <div class="pager-pos" id="counter">– / –</div>
            <button class="pager-btn" id="next"></button>
          </div>
          <div class="app-progress"><div id="progress-bar"></div></div>
          <div class="muted" id="status-summary" style="font-size: 12.5px;"></div>
        </div>

        <div class="app-split">
          <div class="card listing" style="position: relative;" id="listing-card">
            <div id="applied-stamp" class="applied-stamp" hidden>Sent</div>
            <div>
              <div class="row" style="gap: 8px; flex-wrap: wrap;" id="badge-row"></div>
              <div class="listing-title" id="listing-title" style="margin-top: 10px;"></div>
              <div class="listing-meta" id="listing-meta"></div>
            </div>

            <div class="listing-section" id="cv-section" hidden>
              <h4>Recommended CV</h4>
              <div class="row" style="gap: 10px;">
                <div style="width: 38px; height: 48px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-muted); font-size: 9px; font-family: var(--font-mono);">PDF</div>
                <div style="flex: 1;">
                  <div id="cv-name" style="font-size: 13px; color: var(--text-dim); font-family: var(--font-mono);"></div>
                  <div class="muted" style="font-size: 11.5px; margin-top: 2px;">Auto-selected based on tags</div>
                </div>
              </div>
            </div>

            <a id="job-link" target="_blank" rel="noopener" class="btn sm" style="align-self: flex-start;"></a>
          </div>

          <div class="card editor-wrap">
            <div class="editor-tabs">
              <button class="editor-tab active">Cover Letter</button>
              <div class="editor-actions">
                <button class="btn sm" id="copy"></button>
                <button class="btn sm" id="download"></button>
              </div>
            </div>
            <textarea id="letter" class="editor-textarea" spellcheck="true"></textarea>
            <div class="editor-footer">
              <div id="char-count">0 chars</div>
              <div class="row" id="gen-by" style="gap: 6px;"></div>
            </div>
          </div>
        </div>

        <div class="action-bar">
          <button class="btn" id="skip"></button>
          <a class="btn" id="open-listing" target="_blank" rel="noopener"></a>
          <div class="spacer"></div>
          <button class="btn" id="save"></button>
          <button class="btn primary" id="mark-sent"></button>
        </div>
        <div class="muted" id="status" style="text-align: right; margin-top: 8px; font-size: 12.5px;"></div>
      </div>
    </main>
  </div>

  <div class="letter-print-area" id="print-area" aria-hidden="true"></div>

  <script src="/static/toast.js" defer></script>
  <script src="/static/icons.js" defer></script>
  <script src="/static/shell.js" defer></script>
  <script src="/static/apply.js" defer></script>
</body>
</html>
