<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-apply — sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <main class="login-shell">
    <div class="login-card" style="position: relative; z-index: 1;">
      <div class="login-brand">
        <span class="brand-mark">A</span>
        <span style="font-weight: 600; font-size: 16px;">ai-apply</span>
      </div>

      <div style="margin-bottom: 22px;">
        <div class="h2" style="margin-bottom: 4px;">Welcome back</div>
        <div class="muted" style="font-size: 13px;">Sign in to run your job pipelines.</div>
      </div>

      <div class="tabs">
        <a class="tab active" href="/login.html">Sign in</a>
        <a class="tab" href="/signup.html">Sign up</a>
      </div>

      <div id="login-error" class="error-banner" hidden style="margin-bottom: 14px;">
        <div>
          <div style="font-weight:600;margin-bottom:2px;" id="login-error-title">Wrong sign-in method</div>
          <div id="login-error-detail" style="opacity:.85"></div>
        </div>
      </div>

      <div class="stack" style="gap: 8px;">
        <a class="btn block lg" href="/auth/google/login" id="g-btn" hidden></a>
        <a class="btn block lg" href="/auth/github/login" id="gh-btn" hidden></a>
        <a class="btn primary block lg" href="/auth/ms/login" id="ms-btn"></a>
      </div>

      <div class="muted" style="font-size: 12; text-align: center; margin-top: 18px;">
        New here? <a href="/signup.html" style="color: var(--accent-text);">Create an account</a>
      </div>
    </div>
  </main>

  <script src="/static/icons.js"></script>
  <script>
    document.getElementById("g-btn").innerHTML = window.I.google(14) + " Continue with Google";
    document.getElementById("gh-btn").innerHTML = window.I.github(14) + " Continue with GitHub";
    document.getElementById("ms-btn").innerHTML = window.I.mail(14) + " Continue with email";

    fetch("/api/config").then((r) => r.json()).then((cfg) => {
      if (cfg.local) {
        // Local dev has no auth — bounce straight to the app.
        window.location.replace("/");
        return;
      }
      document.getElementById("g-btn").hidden = false;
      document.getElementById("gh-btn").hidden = false;
    }).catch(() => {});

    (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("error") !== "provider_mismatch") return;
      const expected = params.get("expected") || "";
      const attempted = params.get("attempted") || "";
      const email = params.get("email") || "";
      const PROVIDER_LABEL = { github: "GitHub", google: "Google", email: "email" };
      const exp = PROVIDER_LABEL[expected] || expected;
      const att = PROVIDER_LABEL[attempted] || attempted;
      const banner = document.getElementById("login-error");
      const detail = document.getElementById("login-error-detail");
      detail.textContent = `${email} signed up with ${exp}. Use "Continue with ${exp}" — not ${att}.`;
      banner.hidden = false;
      const url = new URL(window.location.href);
      ["error", "expected", "attempted", "email"].forEach((k) => url.searchParams.delete(k));
      window.history.replaceState({}, "", url.pathname + (url.search || ""));
    })();
  </script>
</body>
</html>
