<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-apply · sign up</title>
  <link rel="stylesheet" href="/static/apply.css" />
  <link rel="stylesheet" href="/static/shell.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="/">ai-apply</a>

    <section class="auth-card">
      <h1>Create your account</h1>

      <div class="auth-providers">
        <a class="btn btn-primary auth-provider" href="/auth/ms/signup">
          <span class="provider-glyph">@</span> Sign up with email
        </a>
        <a class="btn btn-outline auth-provider" href="/auth/google/login">
          <span class="provider-glyph">G</span> Continue with Google
        </a>
        <a class="btn btn-outline auth-provider" href="/auth/github/login">
          <span class="provider-glyph">GH</span> Continue with GitHub
        </a>
      </div>

      <p class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </p>
    </section>
  </main>

</body>
</html>
